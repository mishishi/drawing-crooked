<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper background -->
  <rect x="4" y="2" width="24" height="28" rx="2" fill="#FFF8F0" stroke="#2D3436" stroke-width="2"/>
  <!-- Red margin line -->
  <line x1="9" y1="2" x2="9" y2="30" stroke="#FF6B6B" stroke-width="1.5"/>
  <!-- Horizontal lines -->
  <line x1="9" y1="8" x2="26" y2="8" stroke="#ccc" stroke-width="0.8"/>
  <line x1="9" y1="13" x2="26" y2="13" stroke="#ccc" stroke-width="0.8"/>
  <line x1="9" y1="18" x2="26" y2="18" stroke="#ccc" stroke-width="0.8"/>
  <line x1="9" y1="23" x2="26" y2="23" stroke="#ccc" stroke-width="0.8"/>
  <!-- Pencil doodle -->
  <g transform="translate(14, 8) rotate(15)">
    <rect x="0" y="0" width="4" height="14" fill="#FDCB6E" stroke="#2D3436" stroke-width="1"/>
    <polygon points="0,14 2,18 4,14" fill="#2D3436"/>
  </g>
</svg>